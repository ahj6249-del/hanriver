name: Deploy verified Hanriver fixes to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanriver-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REVISION: 6bc0ec1b2861eef88c1dc45aa8913a0597864ede
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: 6bc0ec1b2861eef88c1dc45aa8913a0597864ede
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check calculations and JavaScript syntax
        run: |
          node tests/holding-period.test.mjs
          node tests/export-risk.test.mjs
          for file in app.js domain.js storage.js api.js benchmark.js benchmark-view.js sw.js; do
            node --check "$file"
          done

      - name: Resolve the existing production project
        id: target
        run: |
          python3 - <<'PYCODE'
          import json, os, re, urllib.request, urllib.error
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          if not re.fullmatch(r'[a-fA-F0-9]{32}', account):
              raise SystemExit('CLOUDFLARE_ACCOUNT_ID must contain the 32-character Cloudflare Account ID.')
          root = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects'
          def get(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'].strip()
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      errors = json.load(error).get('errors', [])
                      detail = '; '.join(str(item.get('code')) + ': ' + str(item.get('message')) for item in errors)
                  except Exception:
                      detail = 'Could not read Cloudflare error details.'
                  raise SystemExit(f'Cloudflare project lookup failed (HTTP {error.code}): {detail}')
              if not data.get('success'):
                  raise SystemExit('Cloudflare project lookup was unsuccessful.')
              return data
          target = None
          for page in range(1, 21):
              projects = get(root + f'?page={page}&per_page=10').get('result') or []
              for project in projects:
                  if project.get('subdomain') == 'hanriver-dmm.pages.dev' or 'hanriver-dmm.pages.dev' in (project.get('domains') or []):
                      target = get(root + '/' + project['name']).get('result')
                      break
              if target or len(projects) < 10:
                  break
          if not target:
              raise SystemExit('This account/token cannot find the existing hanriver-dmm.pages.dev project. Check the Account ID and token account scope.')
          name, branch = target.get('name'), target.get('production_branch')
          if not isinstance(name, str) or not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,62}', name):
              raise SystemExit('The existing project name is invalid.')
          if not isinstance(branch, str) or not branch or '\n' in branch or '\r' in branch:
              raise SystemExit('The existing production branch could not be determined.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'project={name}\nbranch={branch}\n')
          print('Verified production target: https://hanriver-dmm.pages.dev/')
          PYCODE

      - name: Prepare public site files
        run: |
          mkdir .deploy
          cp index.html app.js domain.js storage.js api.js benchmark.js benchmark-view.js \
            styles.css sw.js us-symbols.json market-cap-top100.json manifest.webmanifest \
            icon.svg icon-192.png icon-512.png .deploy/

      - name: Deploy to the existing Pages project
        env:
          CF_PROJECT: ${{ steps.target.outputs.project }}
          CF_PRODUCTION_BRANCH: ${{ steps.target.outputs.branch }}
        run: npx --yes wrangler@4 pages deploy .deploy --project-name="$CF_PROJECT" --branch="$CF_PRODUCTION_BRANCH" --commit-hash="$SOURCE_REVISION"

      - name: Verify production serves this revision
        run: |
          python3 - <<'PY'
          import os, pathlib, time, urllib.request
          files = ['app.js', 'domain.js', 'storage.js', 'sw.js']
          for attempt in range(12):
              try:
                  for name in files:
                      url = f'https://hanriver-dmm.pages.dev/{name}?revision={os.environ["SOURCE_REVISION"]}'
                      with urllib.request.urlopen(url, timeout=15) as response:
                          if response.read() != pathlib.Path(name).read_bytes():
                              raise ValueError(f'{name} still serves an older revision')
                  print('Production verified: https://hanriver-dmm.pages.dev/')
                  break
              except Exception as error:
                  if attempt == 11:
                      raise SystemExit(f'Production verification failed: {error}')
                  time.sleep(5)
          PY
