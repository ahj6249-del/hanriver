name: Update market cap TOP 100

# 미국 장 마감 후(평일) Nasdaq 시가총액 TOP 100을 받아 저장소에 반영하고 사이트를 다시 배포한다.
# Actions 탭의 "Run workflow" 버튼으로 언제든 직접 갱신할 수도 있다.
on:
  schedule:
    - cron: '23 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hanriver-market-cap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the latest Nasdaq ranking
        run: node scripts/update-market-cap.mjs

      - name: Commit the updated ranking
        id: commit
        run: |
          if git diff --quiet -- market-cap-top100.json; then
            echo 'No ranking change.'
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          as_of=$(node -p "require('./market-cap-top100.json').asOf")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-cap-top100.json
          git commit -m "Update market cap TOP 100 ($as_of)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN으로 push하면 배포 워크플로가 자동으로 시작되지 않아 직접 실행한다.
      - name: Deploy the updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"
